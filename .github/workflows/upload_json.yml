name: Upload EPL Schedule JSON

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC 실행 (한국 시간 09:00)
  workflow_dispatch:  # GitHub에서 수동 실행 가능

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 🔹 GitHub Actions의 push 권한 추가

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3  # GitHub 저장소의 최신 코드 가져오기

      - name: Python 실행 환경 설정
        uses: actions/setup-python@v3  # Python 설치
        with:
          python-version: '3.9'

      - name: 필요한 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt  # 🔹 패키지 설치 실행

      - name: API 요청 및 JSON 파일 생성
        run: python scripts/generate_json.py

      - name: GitHub에 JSON 파일 업로드
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 🔹 GitHub 인증 추가
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/epl_schedule.json
          git commit -m "자동 업데이트: EPL 경기 일정 JSON"
          git push origin test  # 🔹 올바른 인증 방식 적용
